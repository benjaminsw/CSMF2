# SEQREF-CFG-REF2 v0.1 -- refine2_realnvp
# LIFETIME: KEEP
# STAGE 2: RealNVP_refine on x1 = frozen(NSF base + NICE_refine Run-3
# 531bdbf37f3f, incentive-clean g_dx budget, option (ii)). Inputs
# [y_up, x1, Aᵀr1]; gate vs x1, PRE-REGISTERED two-tier:
#   HARD >= +0.30 (+fwd_rel<=x1, ssim>=x1, diag) | MEANINGFUL >= +0.10
#   (+mean>0, %improved>55%, fwd_rel<=x1, diag).
# Warm-start: RNVP Run-3 refiner ckpt (refiner->refiner: shapes identical,
# pixel-residual scale correct -> only gate.* excluded, threshold 0.9).
refiner:
  flavor: realnvp
  dim: 784
  h_dim: 256
  hidden: 256
  n_layers: 6
  cond_width: 128
  film_hidden: 128
  film_depth: 2
  film_use_gelu: true
  s_max: 4.0
  post_init_std: 0.001
  g_max: 0.5
  g_init: 0.05

base:
  run_dir: ./fashion_seqref/results/bases/nsf/nsf_s4_n0.10_seed0_079f6439b047
  n_post: 16

stage1:
  run_dir: ./fashion_seqref/results/refiners/nice_refine_s4_n0.10_seed0_531bdbf37f3f

warm_start:
  path: ./fashion_seqref/results/refiners/realnvp_refine_s4_n0.10_seed0_d093652b29d2/checkpoint.pt
  min_loaded_fraction: 0.9
  exclude_patterns: ["gate.*"]

train:
  seed: 0
  epochs: 60
  batch_size: 128
  lr: 0.0003
  grad_clip: 5.0
  charbonnier_eps: 0.001
  delta_budget_lambda: 0.001
  budget_form: g_dx

output:
  root: ./fashion_seqref/results/refiners
