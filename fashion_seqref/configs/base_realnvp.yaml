# SEQREF-CFG-BASE v0.3 -- base_realnvp
# LIFETIME: KEEP
# ARM A (paired baseline for the R2 test): RealNVP-flat + conservative CCR.
# v0.2 -> v0.3: shuffle 0.01 -> 0.001, lr 1e-3 -> 3e-4 (grad_norm was 3124);
#               mu stays 10, target 0.05, alpha 0.3, grad_clip 5.0.
expert: realnvp

cell:
  data_root: ./fashion_seqref/data
  blur_sigma: 1.0
  scale: 4
  noise_sigma: 0.10

train:
  seed: 0
  epochs: 100
  batch_size: 128
  lr: 0.0003               # v0.3: 1e-3 -> 3e-4
  grad_clip: 5.0
  early_stop_min_delta: 0.001
  keep_best_checkpoint: true

model:
  dim: 784
  h_dim: 256
  hidden: 256
  n_layers: 6
  use_film: true
  cond_width: 128
  cond_use_v2: true
  film_hidden: 128
  film_depth: 2
  film_use_gelu: true

# CCR conservative (identical in Arm A and Arm B -- only architecture varies)
ccr:
  shuffle_loss_lambda: 0.001   # v0.3: 0.01 -> 0.001
  shuffle_loss_margin: 0.5
  h_std_penalty_mu: 10.0
  h_std_target: 0.05
  cond_y_residual_alpha_init: 0.3

output:
  root: ./fashion_seqref/results/bases/realnvp
