# SEQREF-SMAX v0.2 -- base_realnvp_smax4
# LIFETIME: DIAGNOSTIC
# Run 1b: final scale-ceiling probe. Identical to SEQREF-SMAX v0.1 (Run 1)
# except model.s_max 3.0 -> 4.0. L4-5 clamp was 0.64-0.66 at s_max=3.0.
# Decision rule: unless gate passes (PSNR>16, fwd_rel<0.45), standalone
# rescue closes as partial (conditioning OK, fwd_rel OK, PSNR fail).
# No lambda_rec, no CCR changes, no NICE.
expert: realnvp

cell:
  data_root: ./fashion_seqref/data
  blur_sigma: 1.0
  scale: 4
  noise_sigma: 0.10

train:
  seed: 0
  epochs: 100
  batch_size: 128
  lr: 0.0003
  grad_clip: 5.0
  early_stop_min_delta: 0.001
  keep_best_checkpoint: true

model:
  dim: 784
  h_dim: 256
  hidden: 256
  n_layers: 6
  use_film: true
  cond_width: 128
  cond_use_v2: true
  film_hidden: 128
  film_depth: 2
  film_use_gelu: true
  s_max: 4.0              # Run 1b: 3.0 -> 4.0 (only change)
  post_init_std: 0.001

# CCR conservative -- frozen
ccr:
  shuffle_loss_lambda: 0.001
  shuffle_loss_margin: 0.5
  h_std_penalty_mu: 10.0
  h_std_target: 0.05
  cond_y_residual_alpha_init: 0.3

output:
  root: ./fashion_seqref/results/bases/realnvp_smax
