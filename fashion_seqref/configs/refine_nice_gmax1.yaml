# SEQREF-CFG-REF v0.2 -- refine_nice_gmax1
# LIFETIME: KEEP
# Candidate 2: NICE_refine (Level-1 coupling-as-regressor) on frozen NSF
# base nsf_s4_n0.10_seed0_079f6439b047 (15.94 / 0.299). Warm-start: NICER3 Arm A
# (audited partial, raise <80%). Gate: HARD dpsnr>+0.3, fwd_rel<=x0, base
# frozen; DIAG y_gap>0, atr_gap>0. Arch mirrors Arm A so coupling/FiLM
# tensors load.
refiner:
  flavor: nice
  dim: 784
  h_dim: 256
  hidden: 256
  n_layers: 4
  cond_width: 128
  film_hidden: 128
  film_depth: 2
  film_use_gelu: true
  s_max: 4.0
  post_init_std: 0.001
  g_max: 1.0            # Run 2: 0.5 -> 1.0 (gate saturated at 0.5, dPSNR positive)
  g_init: 0.05

base:
  run_dir: ./fashion_seqref/results/bases/nsf/nsf_s4_n0.10_seed0_079f6439b047
  n_post: 16

warm_start:
  path: ./fashion_seqref/results/bases/nice_r3/nice_s4_n0.10_seed0_06a6cc4c9b66/checkpoint.pt
  min_loaded_fraction: 0.5   # policy excludes output heads (see CPLREG v0.2)

train:
  seed: 0
  epochs: 60
  batch_size: 128
  lr: 0.0003
  grad_clip: 5.0
  charbonnier_eps: 0.001
  delta_budget_lambda: 0.001

output:
  root: ./fashion_seqref/results/refiners
