# SEQREF-CFG-TEST0 v0.1 -- test0_nsf
# LIFETIME: EPHEMERAL
# Test-0 identity (y=x): sigma=0, scale=1, noise=0. Debug/port check ONLY --
# proves NSF can learn a trivial map. NOT a result. Auto-segregated to
# results/bases/nsf/test0_identity_<hash>/ with "test0": true.
expert: nsf

cell:
  data_root: ./fashion_seqref/data
  blur_sigma: 0.0        # identity blur (delta)
  scale: 1               # no downsample -> y is 28x28
  noise_sigma: 0.0       # y == x exactly

train:
  seed: 0
  epochs: 30             # small -- debug
  batch_size: 128
  lr: 0.0005
  early_stop_min_delta: 0.001
  keep_best_checkpoint: true

model:
  dim: 784
  h_dim: 128
  hidden: 256
  n_layers: 6
  use_film: true
  # NSF rejects film_* keys -- do NOT add film_hidden/film_depth/film_use_gelu.

output:
  root: ./fashion_seqref/results/bases/nsf
