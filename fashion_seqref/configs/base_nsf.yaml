# SEQREF-CFG-BASE v0.1 -- base_nsf
# LIFETIME: KEEP
# NSF base expert on the primary cell s4/n0.10. This run's checkpoint is the
# FROZEN BASE for SEQREF-REFINE (x0 = posterior pixel-mean, n_post=16).
# Model block taken from test0_nsf (NSF rejects film_* keys; no CCR -- NSF
# conditioning has never shown collapse on this tree).
expert: nsf

cell:
  data_root: ./fashion_seqref/data
  blur_sigma: 1.0
  scale: 4
  noise_sigma: 0.10

train:
  seed: 0
  epochs: 100
  batch_size: 128
  lr: 0.0005
  grad_clip: 5.0
  early_stop_min_delta: 0.001
  keep_best_checkpoint: true

model:
  dim: 784
  h_dim: 128
  hidden: 256
  n_layers: 6
  use_film: true
  # NSF rejects film_* keys -- do NOT add film_hidden/film_depth/film_use_gelu.

output:
  root: ./fashion_seqref/results/bases/nsf
