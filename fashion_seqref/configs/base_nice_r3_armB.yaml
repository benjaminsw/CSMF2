# SEQREF-NICER3 v0.1 -- base_nice_r3_armB
# LIFETIME: DIAGNOSTIC
# Arm B (R3): NICE + FixedPermute, v2 conditioner, conservative CCR,
# post_init_std carry-over. Differs from Arm A ONLY in use_permute: true.
# Guardrails: n_layers=4 (no extra layers), no lambda_rec.
expert: nice

cell:
  data_root: ./fashion_seqref/data
  blur_sigma: 1.0
  scale: 4
  noise_sigma: 0.10

train:
  seed: 0
  epochs: 100
  batch_size: 128
  lr: 0.0003
  grad_clip: 5.0
  early_stop_min_delta: 0.001
  keep_best_checkpoint: true

model:
  dim: 784
  h_dim: 256
  hidden: 256
  n_layers: 4
  use_film: true
  cond_width: 128
  cond_use_v2: true
  film_hidden: 128
  film_depth: 2
  film_use_gelu: true
  use_permute: true       # <-- the ONLY A/B difference
  post_init_std: 0.001    # carry-over, both arms

# CCR conservative -- identical in both arms
ccr:
  shuffle_loss_lambda: 0.001
  shuffle_loss_margin: 0.5
  h_std_penalty_mu: 10.0
  h_std_target: 0.05
  cond_y_residual_alpha_init: 0.3

output:
  root: ./fashion_seqref/results/bases/nice_r3
