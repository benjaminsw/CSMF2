# SEQREF-CFG-TEST0 v0.1 -- test0_realnvp
# LIFETIME: EPHEMERAL
# Test-0 identity (y=x) for RealNVP. Debug/port check ONLY, not a result.
# Exercises film_* kwargs (RealNVP accepts; NSF rejected them).
expert: realnvp

cell:
  data_root: ./fashion_seqref/data
  blur_sigma: 0.0
  scale: 1
  noise_sigma: 0.0

train:
  seed: 0
  epochs: 30
  batch_size: 128
  lr: 0.0005
  early_stop_min_delta: 0.001
  keep_best_checkpoint: true

model:
  dim: 784
  h_dim: 128
  hidden: 256
  n_layers: 6
  use_film: true
  film_hidden: 64
  film_depth: 1
  film_use_gelu: false

output:
  root: ./fashion_seqref/results/bases/realnvp
