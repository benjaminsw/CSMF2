# SEQREF-CFG-REF v0.3 -- refine_realnvp
# LIFETIME: KEEP
# Candidate 1: RealNVP_refine (Level-1 coupling-as-regressor) on frozen NSF
# base nsf_s4_n0.10_seed0_079f6439b047 (15.94 / 0.299). Warm-start: SMAX Run 1b
# (audited partial, raise <80%). Gate: HARD dpsnr>+0.3, fwd_rel<=x0, base
# frozen; DIAG y_gap>0, atr_gap>0. Arch mirrors Run 1b so coupling/FiLM
# tensors load.
refiner:
  flavor: realnvp
  dim: 784
  h_dim: 256
  hidden: 256
  n_layers: 6
  cond_width: 128
  film_hidden: 128
  film_depth: 2
  film_use_gelu: true
  s_max: 4.0
  post_init_std: 0.001
  g_max: 0.5
  g_init: 0.05

base:
  run_dir: ./fashion_seqref/results/bases/nsf/nsf_s4_n0.10_seed0_079f6439b047
  n_post: 16

warm_start:
  path: ./fashion_seqref/results/bases/realnvp_smax/realnvp_s4_n0.10_seed0_3cf51bd92503/checkpoint.pt
  min_loaded_fraction: 0.5   # policy excludes output heads (see CPLREG v0.2)

train:
  seed: 0
  epochs: 60
  batch_size: 128
  lr: 0.0003
  grad_clip: 5.0
  charbonnier_eps: 0.001
  delta_budget_lambda: 0.001
  budget_form: g_dx      # v0.3: penalty on APPLIED correction (g*dx), not raw dx

output:
  root: ./fashion_seqref/results/refiners
